services:
  # ==================== API Gateway ====================
  api_gateway:
    build:
      context: .
      dockerfile: api_gateway/Dockerfile
    container_name: online_excel_gateway
    ports:
      - "8080:8080"
    depends_on:
      auth_service:
        condition: service_healthy
      table_service:
        condition: service_healthy
    networks:
      - appnet
    volumes:
      - ./api_gateway:/app/api_gateway
    env_file:
      - path: ./api_gateway/.env
        required: false
    environment:
      # JWT (секрет — только через GitHub Secrets)
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-local_dev_secret}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      # URLs сервисов
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth_service:8001}
      - MAIN_SERVICE_URL=${MAIN_SERVICE_URL:-http://table_service:8000}
      # Redis
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Rate limiting & CORS
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000"]}
      # Environment meta
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-local}
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/health/\")' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==================== Auth Service ====================
  auth_service:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    container_name: online_excel_auth_service
    ports:
      - "8001:8001"
    env_file:
      - path: ./auth_service/.env
        required: false
    environment:
      # Database (чувствительные данные — через секреты)
      - DB_HOST=${AUTH_DB_HOST:-auth_db}
      - DB_PORT=${AUTH_DB_PORT:-5432}
      - DB_USER=${AUTH_DB_USER:-postgres}
      - DB_PASSWORD=${AUTH_DB_PASSWORD:-postgres}
      - DB_NAME=${AUTH_DB_NAME:-auth_db}
      - DB_DRIVER=${AUTH_DB_DRIVER:-postgresql+asyncpg}
      # RabbitMQ
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      # Redis
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_RATE_LIMIT_DB=${REDIS_RATE_LIMIT_DB:-1}
      - REDIS_CACHE_DB=${REDIS_CACHE_DB:-2}
      # JWT (обязательно через секрет!)
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-local_dev_secret}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      # Meta
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-local}
      # MiniO
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-avatars}
      - MINIO_SECURE=${MINIO_SECURE:-false}
    restart: on-failure
    depends_on:
      auth_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - appnet
    volumes:
      - ./auth_service:/app/auth_service
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health/\")' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ==================== Table Service ====================
  table_service:
    build:
      context: .
      dockerfile: table_service/Dockerfile
    container_name: online_excel_table_service
    env_file:
      - path: ./table_service/.env
        required: false
    environment:
      # Database (pydantic-settings: префикс EXCEL_APP__)
      - EXCEL_APP__DB_HOST=${TABLE_DB_HOST:-db}
      - EXCEL_APP__DB_PORT=${TABLE_DB_PORT:-5432}
      - EXCEL_APP__DB_USER=${TABLE_DB_USER:-postgres}
      - EXCEL_APP__DB_PASSWORD=${TABLE_DB_PASSWORD:-online_excel}
      - EXCEL_APP__DB_NAME=${TABLE_DB_NAME:-online_excel}
      - EXCEL_APP__DB_DRIVER=${TABLE_DB_DRIVER:-postgresql+asyncpg}
      # Cache (Redis)
      - EXCEL_APP__CACHE_HOST=${CACHE_HOST:-redis}
      - EXCEL_APP__CACHE_PORT=${CACHE_PORT:-6379}
      - EXCEL_APP__CACHE_DB=${CACHE_DB:-0}
      # Elasticsearch
      - EXCEL_APP__ES_HOST=${ES_HOST:-elasticsearch}
      - EXCEL_APP__ES_PORT=${ES_PORT:-9200}
      # RabbitMQ
      - EXCEL_APP__RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - EXCEL_APP__RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - EXCEL_APP__RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - EXCEL_APP__RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - EXCEL_APP__RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      # Meta
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-local}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - appnet
    volumes:
      - ./table_service:/app/table_service
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health/\")' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==================== Infrastructure ====================

  auth_db:
    container_name: online_excel_auth_db
    image: postgres:16-alpine
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
      POSTGRES_USER: ${AUTH_DB_USER:-postgres}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "8010:5432"
    networks:
      - appnet

    volumes:
      - auth_pgdata:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf
    command: [ "postgres", "-c", "config_file=/etc/postgresql/postgresql.conf" ]

  db:
    container_name: online_excel_db
    image: postgres:16-alpine
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${TABLE_DB_PASSWORD:-online_excel}
      POSTGRES_USER: ${TABLE_DB_USER:-postgres}
      POSTGRES_DB: ${TABLE_DB_NAME:-online_excel}
    ports:
      - "7777:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - appnet
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf
    command: [ "postgres", "-c", "config_file=/etc/postgresql/postgresql.conf" ]

  rabbitmq:
    image: rabbitmq:4.2.4-alpine
    container_name: online_excel_rabbitmq
    ports:
      - "5672:5672"      # AMQP protocol
      - "15672:15672"    # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    networks:
      - appnet
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: online_excel_redis
    ports:
      - "6379:6379"
    networks:
      - appnet
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    container_name: online_excel_frontend
    depends_on:
      - api_gateway
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "3000:80"
    networks:
      - appnet

  elasticsearch:
    image: elasticsearch:9.3.0
    container_name: online_excel_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    #    ports:
    #      - "9200:9200"
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - appnet
    volumes:
      - es_data:/usr/share/elasticsearch/data

  minio:
    image: minio/minio:latest
    container_name: online_excel_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web-консоль
    volumes:
      - minio_data:/data
    networks:
      - appnet
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.11.3
    container_name: online_excel_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  pgdata:
  auth_pgdata:
  rabbitmq_data:
  es_data:
  minio_data:
  prom_data: