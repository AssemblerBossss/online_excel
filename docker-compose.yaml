services:
  # ==================== Table migration ====================

  table_migrate:
    build:
      context: .
      dockerfile: table_service/Dockerfile
    command: alembic -c table_service/alembic.ini upgrade head

    depends_on:
      db:
        condition: service_healthy
    environment:
      - EXCEL_APP__DB_HOST=${TABLE_DB_HOST:-db}
      - EXCEL_APP__DB_PORT=${TABLE_DB_PORT:-5432}
      - EXCEL_APP__DB_USER=${TABLE_DB_USER:-postgres}
      - EXCEL_APP__DB_PASSWORD=${TABLE_DB_PASSWORD:-online_excel}
      - EXCEL_APP__DB_NAME=${TABLE_DB_NAME:-online_excel}
      - EXCEL_APP__DB_DRIVER=${TABLE_DB_DRIVER:-postgresql+asyncpg}
    restart: "no"

  auth_migrate:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    command: alembic -c auth_service/alembic.ini upgrade head
    depends_on:
      auth_db:
        condition: service_healthy
    environment:
      - DB_HOST=${AUTH_DB_HOST:-auth_db}
      - DB_PORT=${AUTH_DB_PORT:-5432}
      - DB_USER=${AUTH_DB_USER:-postgres}
      - DB_PASSWORD=${AUTH_DB_PASSWORD:-postgres}
      - DB_NAME=${AUTH_DB_NAME:-auth_db}
      - DB_DRIVER=${AUTH_DB_DRIVER:-postgresql+asyncpg}
    restart: "no"

  chat_migrate:
    build:
      context: .
      dockerfile: chat_service/Dockerfile
    command: alembic -c chat_service/alembic.ini upgrade head
    depends_on:
      chat_db:
        condition: service_healthy
    environment:
      - DB_HOST=${CHAT_DB_HOST:-chat_db}
      - DB_PORT=${CHAT_DB_PORT:-5432}
      - DB_USER=${CHAT_DB_USER:-postgres}
      - DB_PASSWORD=${CHAT_DB_PASSWORD:-postgres}
      - DB_NAME=${CHAT_DB_NAME:-chat_db}
      - DB_DRIVER=${CHAT_DB_DRIVER:-postgresql+asyncpg}
    restart: "no"

  frontend:
    build: ./frontend
    container_name: online_excel_frontend
    depends_on:
      - traefik
    environment:
      VITE_API_URL: http://localhost:11000/api
    ports:
      - "11000:80"
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        tag: "{{.Name}}"

  auth_service:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    labels:
      - "traefik.enable=true"
      # публичные: login/register/refresh/logout — БЕЗ jwt
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.routers.auth.service=auth_service"
      - "traefik.http.routers.auth.middlewares=ratelimit@file,body-limit@file,cors@file"
      # защищённые: /users/* — С jwt
      - "traefik.http.routers.users.rule=PathPrefix(`/users`)"
      - "traefik.http.routers.users.entrypoints=web"
      - "traefik.http.routers.users.service=auth_service"
      - "traefik.http.routers.users.middlewares=ratelimit@file,body-limit@file,cors@file,strip-user-headers@file,jwt-auth@file"
      - "traefik.http.services.auth_service.loadbalancer.server.port=8001"

      - "prometheus.scrape=true"
      - "prometheus.port=8001"
    ports:
      - "8001:8001"
    env_file:
      - path: ./auth_service/.env
        required: false
    environment:
      # Database (чувствительные данные — через секреты)
      - DB_HOST=${AUTH_DB_HOST:-auth_db}
      - DB_PORT=${AUTH_DB_PORT:-5432}
      - DB_USER=${AUTH_DB_USER:-postgres}
      - DB_PASSWORD=${AUTH_DB_PASSWORD:-postgres}
      - DB_NAME=${AUTH_DB_NAME:-auth_db}
      - DB_DRIVER=${AUTH_DB_DRIVER:-postgresql+asyncpg}
      # RabbitMQ
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      # Redis
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_RATE_LIMIT_DB=${REDIS_RATE_LIMIT_DB:-1}
      - REDIS_CACHE_DB=${REDIS_CACHE_DB:-2}
      # JWT (RS256 — подпись приватным ключом, Traefik проверяет публичным)
      - JWT_ALGORITHM=${JWT_ALGORITHM:-RS256}
      - JWT_PRIVATE_KEY_PATH=/run/secrets/jwt_private.pem
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public.pem
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      # Meta
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-local}
      # MiniO
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-avatars}
      - MINIO_SECURE=${MINIO_SECURE:-false}
    restart: on-failure
    depends_on:
      auth_db:
        condition: service_healthy
      auth_migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      fluent-bit:
        condition: service_started
    volumes:
      - ./auth_service:/app/auth_service
      - ./keys/jwt_private.pem:/run/secrets/jwt_private.pem:ro
      - ./keys/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health/\")' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        tag: "{{.Name}}"

  # ==================== Table Service ====================
  table_service:
    build:
      context: .
      dockerfile: table_service/Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.table.rule=PathPrefix(`/tables`) || PathPrefix(`/data`) || PathPrefix(`/search`)"
      - "traefik.http.services.table_service.loadbalancer.server.port=8000"
      - "traefik.http.routers.table.entrypoints=web"
      - "traefik.http.routers.table.service=table_service"
      - "traefik.http.routers.table.middlewares=ratelimit@file,body-limit@file,cors@file,strip-user-headers@file,jwt-auth@file"

      - "prometheus.scrape=true"
      - "prometheus.port=8000"
    env_file:
      - path: ./table_service/.env
        required: false
    environment:
      # Database (pydantic-settings: префикс EXCEL_APP__)
      - EXCEL_APP__DB_HOST=${TABLE_DB_HOST:-db}
      - EXCEL_APP__DB_PORT=${TABLE_DB_PORT:-5432}
      - EXCEL_APP__DB_USER=${TABLE_DB_USER:-postgres}
      - EXCEL_APP__DB_PASSWORD=${TABLE_DB_PASSWORD:-online_excel}
      - EXCEL_APP__DB_NAME=${TABLE_DB_NAME:-online_excel}
      - EXCEL_APP__DB_DRIVER=${TABLE_DB_DRIVER:-postgresql+asyncpg}
      # Cache (Redis)
      - EXCEL_APP__CACHE_HOST=${CACHE_HOST:-redis}
      - EXCEL_APP__CACHE_PORT=${CACHE_PORT:-6379}
      - EXCEL_APP__CACHE_DB=${CACHE_DB:-0}
      # Elasticsearch
      - EXCEL_APP__ES_HOST=${ES_HOST:-elasticsearch}
      - EXCEL_APP__ES_PORT=${ES_PORT:-9200}
      # RabbitMQ
      - EXCEL_APP__RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - EXCEL_APP__RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - EXCEL_APP__RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - EXCEL_APP__RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - EXCEL_APP__RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      # Meta
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-local}
    depends_on:
      db:
        condition: service_healthy
      table_migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      fluent-bit:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./table_service:/app/table_service
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health/\")' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        tag: "{{.Name}}"

  chat_service:
    build:
      context: .
      dockerfile: chat_service/Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chat.rule=PathPrefix(`/chat`) && !PathPrefix(`/chat/ws`)"
      - "traefik.http.services.chat_service.loadbalancer.server.port=8002"
      - "traefik.http.routers.chat.entrypoints=web"
      - "traefik.http.routers.chat.service=chat_service"
      - "traefik.http.routers.chat.middlewares=ratelimit@file,body-limit@file,cors@file,strip-user-headers@file,jwt-auth@file"

      # /chat/ws-ticket — обычный REST-эндпоинт, нужен jwt-auth как везде
      - "traefik.http.routers.chat-ws-ticket.rule=PathPrefix(`/chat/ws-ticket`)"
      - "traefik.http.routers.chat-ws-ticket.entrypoints=web"
      - "traefik.http.routers.chat-ws-ticket.service=chat_service"
      - "traefik.http.routers.chat-ws-ticket.middlewares=ratelimit@file,body-limit@file,cors@file,strip-user-headers@file,jwt-auth@file"

      # /chat/ws — сам WS-хендшейк, БЕЗ jwt-auth (аутентификация через одноразовый тикет)
      - "traefik.http.routers.chat-ws.rule=PathPrefix(`/chat/ws`) && !PathPrefix(`/chat/ws-ticket`)"
      - "traefik.http.routers.chat-ws.entrypoints=web"
      - "traefik.http.routers.chat-ws.service=chat_service"
      - "traefik.http.routers.chat-ws.middlewares=ratelimit@file"
    ports:
      - "8002:8002"
    env_file:
      - path: ./chat_service/.env
        required: false
    environment:
      # Database (чувствительные данные — через секреты)
      - DB_HOST=${CHAT_DB_HOST:-chat_db}
      - DB_PORT=${CHAT_DB_PORT:-5432}
      - DB_USER=${CHAT_DB_USER:-postgres}
      - DB_PASSWORD=${CHAT_DB_PASSWORD:-postgres}
      - DB_NAME=${CHAT_DB_NAME:-chat_db}
      - DB_DRIVER=${CHAT_DB_DRIVER:-postgresql+asyncpg}
      # RabbitMQ
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      # JWT (RS256 — подпись приватным ключом, Traefik проверяет публичным)
      - JWT_ALGORITHM=${JWT_ALGORITHM:-RS256}
      - JWT_PRIVATE_KEY_PATH=/run/secrets/jwt_private.pem
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public.pem
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}

    restart: on-failure
    depends_on:
      chat_db:
        condition: service_healthy
      chat_migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./chat_service:/app/chat_service
      - ./keys/jwt_private.pem:/run/secrets/jwt_private.pem:ro
      - ./keys/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8002/health/\")' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ==================== Infrastructure ====================

  auth_db:
    container_name: online_excel_auth_db
    image: postgres:16-alpine
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
      POSTGRES_USER: ${AUTH_DB_USER:-postgres}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "8010:5432"

    volumes:
      - auth_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    command: [ "postgres", "-c", "config_file=/etc/postgresql/postgresql.conf" ]

  db:
    container_name: online_excel_db
    image: postgres:16-alpine
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${TABLE_DB_PASSWORD:-online_excel}
      POSTGRES_USER: ${TABLE_DB_USER:-postgres}
      POSTGRES_DB: ${TABLE_DB_NAME:-online_excel}
    ports:
      - "7777:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    command: [ "postgres", "-c", "config_file=/etc/postgresql/postgresql.conf" ]

  chat_db:
    container_name: online_excel_chat_db
    image: postgres:16-alpine
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:-postgres}
      POSTGRES_USER: ${CHAT_DB_USER:-postgres}
      POSTGRES_DB: ${CHAT_DB_NAME:-chat_db}
    ports:
      - "7778:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - chat_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    command: [ "postgres", "-c", "config_file=/etc/postgresql/postgresql.conf" ]

  rabbitmq:
    image: rabbitmq:4.2.4-alpine
    container_name: online_excel_rabbitmq
    ports:
      - "5672:5672"      # AMQP protocol
      - "15672:15672"    # Management UI
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=15692"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: online_excel_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: elasticsearch:9.3.0
    container_name: online_excel_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    #    ports:
    #      - "9200:9200"
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    volumes:
      - es_data:/usr/share/elasticsearch/data

  minio:
    image: minio/minio:latest
    container_name: online_excel_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=9000"
      - "prometheus.path=/minio/v2/metrics/cluster"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web-консоль
    volumes:
      - minio_data:/data

    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.11.3
    container_name: online_excel_prometheus
    user: root
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:12.2.9
    container_name: online_excel_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro

  kibana:
    image: kibana:9.3.0
    container_name: online_excel_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  fluent-bit:
    image: fluent/fluent-bit:3.2
    container_name: online_excel_fluent_bit
    volumes:
      - ./infra/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./infra/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    ports:
      - "24224:24224"
      - "24224:24224/udp"
      - "2020:2020"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: on-failure

  traefik:
    image: traefik:v3.7
    container_name: online_excel_traefik
    ports:
      - "8081:80"
      - "8090:8080"
    volumes:
      - ./keys/jwt_public.pem:/run/secrets/jwt_public.pem:ro
      - ./infra/traefik/dynamic.yaml.tmpl:/etc/traefik/dynamic.yaml.tmpl:ro
      - ./infra/traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8080"
    environment:
      - JWT_PUBLIC_KEY_FILE=/run/secrets/jwt_public.pem
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        if [ ! -f "$$JWT_PUBLIC_KEY_FILE" ]; then
          echo "ERROR: JWT public key file not found at $$JWT_PUBLIC_KEY_FILE"
          exit 1
        fi

        echo "Generating dynamic.yaml from template..."

        # Вставляем ключ на место $${JWT_PUBLIC_KEY}, сохраняя отступ строки-плейсхолдера
        awk -v keyfile="$$JWT_PUBLIC_KEY_FILE" '
          /\$\{JWT_PUBLIC_KEY\}/ {
            match($$0, /^[[:space:]]*/)
            indent = substr($$0, 1, RLENGTH)
            while ((getline line < keyfile) > 0) print indent line
            next
          }
          { print }
        ' /etc/traefik/dynamic.yaml.tmpl > /etc/traefik/dynamic.yaml

        echo "Generating dynamic.yaml from template..."

        # Вставляем ключ на место $${JWT_PUBLIC_KEY}, сохраняя отступ строки-плейсхолдера
        awk -v keyfile="$$JWT_PUBLIC_KEY_FILE" '
          /\$\{JWT_PUBLIC_KEY\}/ {
            match($$0, /^[[:space:]]*/)
            indent = substr($$0, 1, RLENGTH)
            while ((getline line < keyfile) > 0) print indent line
            next
          }
          { print }
        ' /etc/traefik/dynamic.yaml.tmpl > /etc/traefik/dynamic.yaml

        if [ ! -s /etc/traefik/dynamic.yaml ]; then
          echo "ERROR: Failed to generate dynamic.yaml"
          exit 1
        fi
        echo "dynamic.yaml generated successfully"
        head -n 35 /etc/traefik/dynamic.yaml

        traefik --configfile=/etc/traefik/traefik.yaml
    depends_on:
      auth_service:
        condition: service_healthy

networks:
  default:
    name: appnet
    driver: bridge

volumes:
  pgdata:
  auth_pgdata:
  chat_pgdata:
  rabbitmq_data:
  es_data:
  minio_data:
  prom_data:
  grafana_data: