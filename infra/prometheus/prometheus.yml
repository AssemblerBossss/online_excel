global:
  scrape_interval: 10s


scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: [ "localhost:9090" ]

  - job_name: "traefik"
    static_configs:
      - targets: [ "traefik:8080" ]

  - job_name: "auth_service"
    static_configs:
      - targets: [ "auth_service:8001" ]

  - job_name: "table_service"
    static_configs:
      - targets: [ "table_service:8000" ]

  - job_name: "minio"
    static_configs:
      - targets: [ "minio:9000" ]
    metrics_path: "/minio/v2/metrics/cluster"
    
  - job_name: "rabbitmq"
    static_configs:
      - targets: [ "rabbitmq:15692" ]