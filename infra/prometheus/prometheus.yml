global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: [ "localhost:9090" ]
    relabel_configs:
      - source_labels: [ __address__ ]
        regex: "(.*):(.*)"
        replacement: "$2"
        target_label: port
      - source_labels: [ __address__ ]
        regex: "(.*):(.*)"
        replacement: "$1"
        target_label: host

  - job_name: "traefik"
    static_configs:
      - targets: [ "traefik:8080" ]
    relabel_configs:
      - source_labels: [ __address__ ]
        regex: "(.*):(.*)"
        replacement: "$2"
        target_label: port
      - source_labels: [ __address__ ]
        regex: "(.*):(.*)"
        replacement: "$1"
        target_label: host

  - job_name: "auth_service"
    static_configs:
      - targets: [ "auth_service:8001" ]
    relabel_configs:
      - source_labels: [ __address__ ]
        regex: "(.*):(.*)"
        replacement: "$2"
        target_label: port
      - source_labels: [ __address__ ]
        regex: "(.*):(.*)"
        replacement: "$1"
        target_label: host

  - job_name: "table_service"
    static_configs:
      - targets: [ "table_service:8000" ]
    relabel_configs:
      - source_labels: [ __address__ ]
        regex: "(.*):(.*)"
        replacement: "$2"
        target_label: port
      - source_labels: [ __address__ ]
        regex: "(.*):(.*)"
        replacement: "$1"
        target_label: host

  - job_name: "minio"
    static_configs:
      - targets: [ "minio:9000" ]
    metrics_path: "/minio/v2/metrics/cluster"
    relabel_configs:
      - source_labels: [ __address__ ]
        regex: "(.*):(.*)"
        replacement: "$2"
        target_label: port
      - source_labels: [ __address__ ]
        regex: "(.*):(.*)"
        replacement: "$1"
        target_label: host

  - job_name: "rabbitmq"
    static_configs:
      - targets: [ "rabbitmq:15692" ]
    relabel_configs:
      - source_labels: [ __address__ ]
        regex: "(.*):(.*)"
        replacement: "$2"
        target_label: port
      - source_labels: [ __address__ ]
        regex: "(.*):(.*)"
        replacement: "$1"
        target_label: host