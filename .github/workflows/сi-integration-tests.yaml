name: CI - Integration Tests

on:
  workflow_run:
    workflows:
      - "CI - Auth Service"
      - "CI - API Gateway Service"
      - "CI - Table Service"
    types: [ completed ]
    branches: [ main, develop ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: online_excel_test
  PYTHON_VERSION: '3.13'

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      all_passed: ${{ steps.check.outputs.all_passed }}
    steps:
      - id: check
        run: echo "all_passed=true" >> $GITHUB_OUTPUT

  integration_tests:
    runs-on: ubuntu-latest
    needs: [ check-dependencies ]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio httpx pytest-timeout

      # Валидация конфигурации (поймает ошибки подстановки переменных ДО запуска)
      - name: Validate docker-compose config
        run: docker compose config > /dev/null
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          AUTH_DB_PASSWORD: ${{ secrets.AUTH_DB_PASSWORD }}
          TABLE_DB_PASSWORD: ${{ secrets.TABLE_DB_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}

          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}

      - name: Start services and wait for healthy
        run: docker compose up -d --wait --timeout 120
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

          AUTH_DB_PASSWORD: ${{ secrets.AUTH_DB_PASSWORD }}
          TABLE_DB_PASSWORD: ${{ secrets.TABLE_DB_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}

          # Эти значения хранятся в: Settings → Secrets and variables → Actions → Variables
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}

      - name: Run integration tests
        run: |
          pytest tests/integration \
            -m integration \
            -v \
            --timeout=120 \
            --junitxml=integration-report.xml

      - name: Save logs on failure
        if: failure()
        run: docker compose logs > integration-logs.txt

      - name: Upload test report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-result
          path: |
            integration-report.xml
            integration-logs.txt

      - name: Tear down services
        if: always()
        run: docker compose down -v --remove-orphans