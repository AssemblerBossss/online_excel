http:
  routers:
    auth:
      rule: "PathPrefix(`/auth`) || PathPrefix(`/users`)"
      entrypoints: [ web ]
      service: auth-service
      middlewares: [ ratelimit, body-limit, cors ]

    table:
      rule: "PathPrefix(`/tables`) || PathPrefix(`/data`) || PathPrefix(`/search`)"
      entrypoints: [ web ]
      service: table-service
      middlewares: [ ratelimit, body-limit, cors ]

  middlewares:
    ratelimit:
      average: 60
      period: 1m
      burst: 60
      sourceCriterion:
        ipStrategy:
          depth: 1          # за nginx — берём реальный IP из X-Forwarded-For

    body-limit:
      buffering:
        maxRequestBodyBytes: 10485760   # 10 MB

    cors:
      headers:
        accessControlAllowOriginList: [ "http://localhost:3000" ]
        accessControlAllowMethods: [ "GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS" ]
        accessControlAllowHeaders: [ "*" ]
        accessControlAllowCredentials: true
        accessControlExposeHeaders: [ "Content-Disposition" ]   # для экспорта Excel