http:
  middlewares:
    ratelimit:
      rateLimit:
        average: 60
        period: 1m
        burst: 60
        sourceCriterion:
          ipStrategy:
            depth: 1          # за nginx — берём реальный IP из X-Forwarded-For

    strip-user-headers:
      headers:
        customRequestHeaders:
          X-User-ID: ""
          X-User-Email: ""
          X-User-Role: ""
          X-User-Active: ""

    body-limit:
      buffering:
        maxRequestBodyBytes: 10485760   # 10 MB

    jwt-auth:
      plugin:
        jwt:
          Required: true
          Alg: HS256
          Keys:
            - '{"kty":"oct","alg":"HS256","k":"bG9jYWxfZGV2X3NlY3JldA"}'
          PayloadFields:
            - exp
          JwtHeaders:
            X-User-ID: user_id
            X-User-Email: email
            X-User-Role: role
            X-User-Active: is_active

    cors:
      headers:
        accessControlAllowOriginList: [ "http://localhost:3000" ]
        accessControlAllowMethods: [ "GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS" ]
        accessControlAllowHeaders: [ "*" ]
        accessControlAllowCredentials: true
        accessControlExposeHeaders: [ "Content-Disposition" ]   # для экспорта Excel