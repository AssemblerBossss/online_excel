http:
  middlewares:
    ratelimit:
      rateLimit:
        average: 60
        period: 1m
        burst: 60
        sourceCriterion:
          ipStrategy:
            depth: 1          # за nginx — берём реальный IP из X-Forwarded-For

    body-limit:
      buffering:
        maxRequestBodyBytes: 10485760   # 10 MB

    jwt-auth:
      plugin:
        jwt:
          required: true
          alg: HS256
          keys:
            - local_dev_secret       # тот же JWT_SECRET_KEY, что в auth_service
          payloadFields:
            - exp                     # обязательные поля в payload
          forwardHeaders:
            X-User-Id: sub
            X-User-Email: email
            X-User-Role: role

    cors:
      headers:
        accessControlAllowOriginList: [ "http://localhost:3000" ]
        accessControlAllowMethods: [ "GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS" ]
        accessControlAllowHeaders: [ "*" ]
        accessControlAllowCredentials: true
        accessControlExposeHeaders: [ "Content-Disposition" ]   # для экспорта Excel