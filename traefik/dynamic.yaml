http:
  middlewares:
    ratelimit:
      rateLimit:
        average: 60
        period: 1m
        burst: 60
        sourceCriterion:
          ipStrategy:
            depth: 1          # за nginx — берём реальный IP из X-Forwarded-For

    strip-user-headers:
      headers:
        customRequestHeaders:
          X-User-ID: ""
          X-User-Email: ""
          X-User-Role: ""
          X-User-Active: ""

    body-limit:
      buffering:
        maxRequestBodyBytes: 10485760   # 10 MB

    jwt-auth:
      plugin:
        jwt:
          Required: true
          Alg: RS256
          Keys:
            - |
              -----BEGIN PUBLIC KEY-----
              MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAy99Vdc6zpXX0kmsNi0Hm
              leLKezjQ7+IaU5ziNlija87EpQRTQ4Cd2lwLfLtLHo5CgaWFNCDdVRrBE+h7X1Ho
              kWbT+6iNHjdpD3AB9NAHMTABPRUrN5g6VhLQfagw5uFUohKSXpx9G2AOTqEloBjl
              wX/cGr68GMgVCoZzb4tMKfw3T1tT+O48tUZdKZWuvW9F34ki/bP+tM20LGLlJPKd
              Y1IJsNpzkUUYTb+H0RbYWxonw6TkxGuGvI1uHzzIeAtlefHLQzY5xMIjYBcFgX+L
              DqPeg5qlcbyg5cYCScNs1isc5o1p/QwmRnRLfGIX9TyITQZJyEDGCZIUq0u5TEpr
              xQIDAQAB
              -----END PUBLIC KEY-----
          PayloadFields:
            - exp
          JwtHeaders:
            X-User-ID: user_id
            X-User-Email: email
            X-User-Role: role
            X-User-Active: is_active

    cors:
      headers:
        accessControlAllowOriginList: [ "http://localhost:11000" ]
        accessControlAllowMethods: [ "GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS" ]
        accessControlAllowHeaders: [ "*" ]
        accessControlAllowCredentials: true
        accessControlExposeHeaders: [ "Content-Disposition" ]   # для экспорта Excel