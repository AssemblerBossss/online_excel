[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "AssemblerBossss",email = "nazarovmisa39@mail.ru"}
]
readme = "README.md"
package-mode = false
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi (>=0.119.1,<0.120.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "alembic (>=1.17.0,<2.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "pydantic[email] (>=2.12.3,<3.0.0)",
    "bcrypt (==4.1.3)",
    "pandas (>=2.3.3,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "aio-pika (>=9.5.8,<10.0.0)",
    "fastapi-cache2[redis] (>=0.2.2,<0.3.0)",
    "elasticsearch[async] (>=9.3.0,<10.0.0)",
    "slowapi (>=0.1.9,<0.2.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "aiobreaker (>=1.2.0,<2.0.0)",
    "miniopy-async (>=1.23.5,<2.0.0)",
]

[tool.poetry]
packages = [{include = "**/*"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)",
    "ruff (>=0.15.12,<0.16.0)"
]
