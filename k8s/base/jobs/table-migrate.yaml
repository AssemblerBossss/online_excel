apiVersion: batch/v1
kind: Job
metadata:
  name: table-migrate
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-db
          image: postgres:16-alpine
          command: [ "sh", "-c", "until pg_isready -h table-db -U postgres; do sleep 2; done" ]
      containers:
        - name: migrate
          image: online-excel/table-service:latest
          imagePullPolicy: IfNotPresent
          command: [ "alembic", "-c", "table_service/alembic.ini", "upgrade", "head" ]
          envFrom:
            - configMapRef: { name: table-service-config }
          env:
            - name: EXCEL_APP__DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: TABLE_DB_PASSWORD }