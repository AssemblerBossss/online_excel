config:
  service: |
    [SERVICE]
        Flush         5
        Daemon        Off
        Log_Level     info
        Parsers_File  parsers.conf
        Parsers_File  custom_parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Parser            cri
        Tag               kube.*
        Refresh_Interval  5
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
    [FILTER]
        Name         parser
        Match        kube.*
        Key_Name     log
        Parser       json_try
        Reserve_Data On
    [FILTER]
        Name    record_modifier
        Match   *
        Record  environment kubernetes
  outputs: |
    [OUTPUT]
        Name              es
        Match             *
        Host              elasticsearch
        Port              9200
        Index             app-logs
        Logstash_Format   On
        Logstash_Prefix   app-logs
        Logstash_DateFormat %Y.%m.%d
        Suppress_Type_Name On
        Retry_Limit       5
        Replace_Dots      On
        Time_Key          @timestamp
        Time_Key_Format   %Y-%m-%dT%H:%M:%S.%3NZ
        Include_Tag_Key   On
        Tag_Key           container_tag
  customParsers: |
    [PARSER]
        Name         json_try
        Format       json
        Time_Key     time
        Time_Format  %Y-%m-%dT%H:%M:%S.%3NZ
        Time_Keep    On