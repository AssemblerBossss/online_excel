apiVersion: v1
kind: Service
metadata:
  name: table-service
spec:
  selector:
    app: table-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: table-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: table-service
  template:
    metadata:
      labels:
        app: table-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: table-service
          image: online_excel-table_service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: table-service-config
          env:
            - name: EXCEL_APP__DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: TABLE_DB_PASSWORD
            - name: EXCEL_APP__RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_PASSWORD
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi