apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 8001
      targetPort: 8001

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
    template:
      metadata:
        labels:
          app: auth-service
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8001"
      spec:
        - name: auth-service
          image: online-excel/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef: { name: auth-service-config }
          env:
            - name: EXCEL_APP__DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: AUTH_DB_PASSWORD }
          readinessProbe:
            httpGet: { path: /health/, port: 8001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/, port: 8001 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1",  memory: 512Mi }
