apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.7
          ports:
            - name: web
              containerPort: 80
            - name: dashboard
              containerPort: 8080
          volumeMounts:
            - name: static-config
              mountPath: /etc/traefik/traefik.yaml
              subPath: traefik.yaml
              readOnly: true
            - name: dynamic-config
              mountPath: /etc/traefik/dynamic.yaml
              subPath: dynamic.yaml
              readOnly: true
            - name: jwt-keys
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: static-config
          configMap:
            name: traefik-static-config
        - name: dynamic-config
          configMap:
            name: traefik-dynamic-config
        - name: jwt-keys
          secret:
            secretName: jwt-keys
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
spec:
  type: NodePort
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: 80
      nodePort: 30080
    - name: dashboard
      port: 8080
      targetPort: 8080
      nodePort: 30880