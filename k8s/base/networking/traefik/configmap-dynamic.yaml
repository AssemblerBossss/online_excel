apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-dynamic-config
data:
  dynamic.yaml: |
    http:
      middlewares:
        ratelimit:
          rateLimit:
            average: 60s
            period: 1m
            burst: 60
            sourceCriterion:
              ipStrategy:
                depth: 1

        strip-user-headers:
          headers:
            customRequestHeaders:
              X-User-ID: ""
              X-User-Email: ""
              X-User-Role: ""
              X-User-Active: ""

        body-limit:
          buffering:
            maxRequestBodyBytes: 10485760

        jwt-auth:
          plugin:
            jwt:
              Required: true
              Alg: RS256
              KeysFiles:
                - /run/secrets/jwt_public.pem
              PayloadFields:
                - exp
              JwtHeaders:
                X-User-ID: user_id
                X-User-Email: email
                X-User-Role: role
                X-User-Active: is_active

        cors:
          headers:
            accessControlAllowOriginList: ["http://localhost:3000"]
            accessControlAllowMethods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
            accessControlAllowHeaders: ["*"]
            accessControlAllowCredentials: true
            accessControlExposeHeaders: ["Content-Disposition"]
