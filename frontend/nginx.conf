server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    proxy_hide_header Server;
    proxy_hide_header Date;

    # SPA: отдаём статику, всё остальное на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API на backend-сервис
    location /api/ {
        proxy_pass  http://traefik:80/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Бэкенд не знает про префикс /api и может вернуть редирект на слеш
        # (FastAPI: /tables -> /tables/). Возвращаем префикс /api в Location,
        # иначе редирект уводит на SPA-роут и приходит HTML вместо JSON.
        proxy_redirect ~^(https?://[^/]+)/(.*)$ $1/api/$2;

        # Передача cookies от клиента к бэкенду
        proxy_set_header Cookie $http_cookie;
        
        # Передача cookies от бэкенда к клиенту
        proxy_cookie_path / /;
        proxy_pass_header Set-Cookie;
        # Убираем Secure флаг для dev окружения (HTTP)
        proxy_cookie_flags user_access_token httponly samesite=lax;
        proxy_cookie_flags user_refresh_token httponly samesite=lax;
    }

    location /ws/ {
        proxy_pass http://traefik:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }


    # Кэширование статики
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}