imagePullPolicy: IfNotPresent

authService:
  image: online_excel-auth_service
  tag: latest
  replicas: 1
  port: 8001
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  config:
    ACCESS_TOKEN_EXPIRE_MINUTES: "30"
    REFRESH_TOKEN_EXPIRE_DAYS: "30"
    REDIS_RATE_LIMIT_DB: "1"
    REDIS_CACHE_DB: "2"
    MINIO_BUCKET: avatars
    MINIO_SECURE: "false"

tableService:
  image: online_excel-table_service
  tag: latest
  replicas: 2
  port: 8000
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  config:
    EXCEL_APP__CACHE_DB: "0"

notificationService:
  image: online_excel-notification_service
  tag: latest
  replicas: 1
  port: 8000
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }
  config:
    LOG_LEVEL: info
    SMTP_FROM: no-reply@online-excel.local

frontend:
  image: online_excel-frontend
  tag: latest
  replicas: 1
  port: 30090
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }
  config:
    LOG_LEVEL: info
    SMTP_FROM: no-reply@online-excel.local

postgres:
  image: postgres:16-alpine
  user: postgres
  storage: 1Gi
  # имя -> БД и ключ пароля в Secret app-secrets
  databases:
    auth-db:
      name: auth_db
      passwordKey: AUTH_DB_PASSWORD
    table-db:
      name: online_excel
      passwordKey: TABLE_DB_PASSWORD
    notification-db:
      name: notifications
      passwordKey: NOTIFICATION_DB_PASSWORD

redis:
  image: redis:7-alpine

rabbitmq:
  image: rabbitmq:4.2.4-alpine
  storage: 1Gi

elasticsearch:
  image: elasticsearch:9.3.0
  javaOpts: "-Xms512m -Xmx512m"
  storage: 1Gi

minio:
  image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
  storage: 1Gi
  nodePort: 30900

# SMTP-заглушка для dev: письма не уходят наружу, видны в веб-UI
mailpit:
  image: axllent/mailpit:v1.32
  uiNodePort: 30825

traefik:
  image: traefik:v3.7
  jwtPluginVersion: v0.10.0
  nodePort: 30080
  dashboardNodePort: 30880
  corsOrigins:
    - http://localhost:3000
  rateLimit:
    average: 60
    burst: 60
  maxRequestBodyBytes: 10485760

monitoring:
  # releaseName чарта kube-prometheus-stack — по этой метке Prometheus ищет ServiceMonitor
  release: monitoring
  scrapeInterval: 15s

# Заполняются из values.secret.yaml и --set-file (см. Makefile)
secrets:
  tableDbPassword: ""
  authDbPassword: ""
  notificationDbPassword: ""
  rabbitmqUser: ""
  rabbitmqPassword: ""
  jwtSecretKey: ""
  minioRootUser: ""
  minioRootPassword: ""
  grafanaAdminUser: ""
  grafanaAdminPassword: ""

jwt:
  privateKey: ""
  publicKey: ""