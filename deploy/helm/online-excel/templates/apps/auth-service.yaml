{{- $ctx := dict "name" "auth-service" "root" . }}
{{- with  .Values.authService }}
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    {{- include "online-excel.componentLabels" $ctx | nindent 4 }}
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: {{ .port }}
      targetPort: {{ .port }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    {{- include "online-excel.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        {{- include "online-excel.componentLabels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: auth-service
          image: {{ include "online-excel.image" . }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .port }}
          envFrom:
            - configMapRef:
                name: auth-service-config
          env:
            {{- include "online-excel.authSecretEnv" $ | nindent 12 }}
            - name: JWT_SECRET_KEY
              {{- include "online-excel.secretRef" "JWT_SECRET_KEY" | nindent 14 }}
            - name: JWT_ALGORITHM
              {{- include "online-excel.secretRef" "JWT_ALGORITHM" | nindent 14 }}
            - name: MINIO_ACCESS_KEY
              {{- include "online-excel.secretRef" "MINIO_ROOT_USER" | nindent 14 }}
            - name: MINIO_SECRET_KEY
              {{- include "online-excel.secretRef" "MINIO_ROOT_PASSWORD" | nindent 14 }}
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/jwt-keys
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/
              port: {{ .port }}
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/
              port: {{ .port }}
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            {{- toYaml .resources | nindent 12 }}
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys

{{- end }}