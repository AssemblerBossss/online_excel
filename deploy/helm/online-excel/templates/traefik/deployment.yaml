{{- $ctx := dict "name" "traefik" "root" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  labels:
    {{- include "online-excel.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        {{- include "online-excel.componentLabels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: {{ .Values.traefik.image }}
          args:
            - -configFile=/etc/traefik/static/traefik.yaml
          ports:
            - name: web
              containerPort: 80
            - name: dashboard
              containerPort: 8080
          volumeMounts:
            - name: static-config
              mountPath: /etc/traefik/static/
              readOnly: true
            - name: jwt-public-key
              mountPath: /etc/jwt-keys
              readOnly: true
      volumes:
        - name: static-config
          configMap:
            name: traefik-static-config
        - name: jwt-public
          secret:
            secretName: jwt-keys
            items:
              - key: jwt_public.pem
                path: jwt_public.pem

---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  labels:
    {{- include "online-excel.componentLabels" $ctx | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: 80
      nodePort: {{ .Values.traefik.nodePort }}
    - name: dashboard
      port: 8080
      targetPort: 8080
      nodePort: {{ .Values.traefik.dashboardNodePort }}