apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  labels:
    {{- include "online-excel.labels" . | nindent 4 }}
data:
  DB_HOST: auth-db
  DB_PORT: "5432"
  DB_USER: {{ .Values.postgres.user }}
  DB_NAME: {{ (index .Values.postgres.databases "auth-db").name }}
  DB_DRIVER: postgresql+asyncpg
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_URL: http://{{ .Values.nodeIp }}:{{ .Values.minio.nodePort }}
  JWT_PRIVATE_KEY_PATH: /etc/jwt-keys/jwt_private.pem
  JWT_PUBLIC_KEY_PATH: /etc/jwt-keys/jwt_public.pem
  {{- toYaml .Values.authService.config | nindent 2 }}

--- 
apiVersion: v1
kind: ConfigMap
metadata:
  name: table-service-config
  labels:
    {{- include "online-excel.labels" . | nindent 4 }}  
data:
  EXCEL_APP__DB_HOST: table-db
  EXCEL_APP__DB_PORT: "5432"
  EXCEL_APP__DB_USER: {{ .Values.postgres.user }}
  EXCEL_APP__DB_NAME: {{ (index .Values.postgres.databases "table-db").name }}
  EXCEL_APP__DB_DRIVER: postgresql+asyncpg
  EXCEL_APP__CACHE_HOST: redis
  EXCEL_APP__CACHE_PORT: "6379"
  EXCEL_APP__ES_HOST: elasticsearch
  EXCEL_APP__ES_PORT: "9200"
  EXCEL_APP__RABBITMQ_HOST: rabbitmq
  EXCEL_APP__RABBITMQ_PORT: "5672"
  {{- toYaml .Values.tableService.config | nindent 2 }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  labels:
    {{- include "online-excel.labels" . | nindent 4 }}  
data:
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: {{ .Values.notificationService.port | quote }}
  POSTGRES_HOST: notification-db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: {{ .Values.postgres.user }}
  POSTGRES_DB: {{ (index .Values.postgres.databases "notification-db").name }}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  {{- toYaml .Values.notificationService.config | nindent 2 }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  labels:
    {{- include "online-excel.labels" . | nindent 4 }}
data:
  postgresql.conf: |
    {{- .Files.Get "files/postgresql.conf" | nindent 4 }}

---