apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    {{- include "online-excel.labels" . | nindent 4 -}}
type: Opaque
stringData:
  {{- with .Values.secrets }}
  TABLE_DB_PASSWORD: {{ required "secrets.tableDbPassword не задан - нужен -f values.secret.yaml" .tableDbPassword | quote }}
  AUTH_DB_PASSWORD: {{ required "secrets.tableDbPassword не задан - нужен -f values.secret.yaml" .authDbPassword | quote }}
  NOTIFICATION_DB_PASSWORD: {{ required "secrets.notificationDbPassword не задан - нужен -f values.secret.yaml" .notificationDbPassword | quote }}
  RABBITMQ_USER:  {{ required "secrets.rabbitmqUser не задан - нужен -f values.secret.yaml" .rabbitmqUser | quote }}
  RABBITMQ_PASSWORD: {{ required "secrets.rabbitmqPassword не задан - нужен -f values.secret.yaml" .rabbitmqPassword | quote }}
  JWT_SECRET_KEY: {{ required "secrets.jwtSecretKey не задан - нужен -f values.secret.yaml" .jwtSecretKey | quote }}
  JWT_ALGORITHM: RS256
  MINIO_ROOT_USER: {{ required "secrets.minioRootUser не задан - нужен -f values.secret.yaml" .minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ required "secrets.minioRootPassword не задан - нужен -f values.secret.yaml" .minioRootPassword | quote }}
  GRAFANA_ADMIN_USER: {{ required "secrets.rabbitmqUser не задан - нужен -f values.secret.yaml" .grafanaAdminUser | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ required "secrets.rabbitmqUser не задан - нужен -f values.secret.yaml" .grafanaAdminPassword | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-keys
  labels:
    {{- include "online-excel.labels" . | nindent 4 -}}
type: Opaque
stringData:
  jwt_private.pem: |
    {{- required "jwt.privateKey: --set-file jwt.privateKey=keys/jwt_private.pem" .Values.jwt.privateKey | nindent 4 }} 
  jwt_private.pem: |
    {{- required "jwt.privateKey: --set-file jwt.privateKey=keys/jwt_public.pem" .Values.jwt.publicKey | nindent 4 }} 