{{- $ctx := dict "name" "redis" "root" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "online-excel.componentLabels" $ctx | nindent 4}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        {{- include "online-excel.componentLabels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
          ports:
            - containerPort: 6379
              name: redis
          livenessProbe:
            exec:
              command: [ "redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            exec:
              command: [ "redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 5
---

apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
  {{- include "online-excel.componentLabels" $ctx | nindent 4}}
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379