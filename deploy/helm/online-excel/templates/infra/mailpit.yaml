{{- $ctx := dict "name" "mailpit" "root" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: mailpit
  labels:
    {{- include "online-excel.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        {{- include "online-excel.componentLabels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: mailpit
          image: {{ .Values.mailpit.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8025
            - name: smtp
              containerPort: 1025
          readinessProbe:
            tcpSocket:
              port: 1025
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits: { memory: "128Mi", cpu: "200m" }

apiVersion: v1
kind: Service
metadata:
  name: mailtip
  labels:
    {{- include "online-excel.componentLabels" $ctx | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: mailtip
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: ui
      port: 8025
      targetPort: 8025
      nodePort: {{ .Values.mailpit.uiNodePort }}
