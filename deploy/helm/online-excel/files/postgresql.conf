listen_addresses = '*'
port = 5432
max_connections = 100
# ================================
# PostgreSQL JSON Logging Config
# ================================

# --- Логирование в JSON ---
log_destination = 'jsonlog'        # вывод в JSON
logging_collector = on             # включаем сбор логов
log_directory = 'pg_log'           # директория для файлов логов
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_truncate_on_rotation = on      # обрезать старые файлы при ротации
log_rotation_age = 1d              # ротация каждый день
log_rotation_size = 100MB          # или при достижении 100MB
log_timezone = 'UTC'               # фиксируем UTC для всех логов

# --- Что логировать ---
log_statement = 'all'              # все изменения: INSERT/UPDATE/DELETE
log_duration = on                  # время выполнения запросов
log_connections = on               # вход/выход пользователей
log_disconnections = on
log_error_verbosity = default      # полная информация об ошибках

# --- Полезные настройки ---
client_min_messages = notice       # минимальный уровень сообщений для клиентов
log_min_messages = info            # минимальный уровень для файлов логов
log_checkpoints = on               # логирование контрольных точек
log_autovacuum_min_duration = 0    # логирование всех автovacuum
log_lock_waits = on                # логирование ожидания блокировок