
[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info

    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   6M

[FILTER]
    Name         parser
    Match        *
    Key_Name     log
    Parser       json_try
    Reserve_Data On

[FILTER]
    Name    record_modifier
    Match   *
    Record  environment docker-compose

[OUTPUT]
    Name            es
    Match           *
    Host            elasticsearch
    Port            9200
    Index           app-logs
    Logstash_Format On
    Logstash_Prefix app-logs
    Logstash_DateFormat %Y.%m.%d
    Suppress_Type_Name On
    Retry_Limit     5
    Replace_Dots    On
    Time_Key        @timestamp
    Time_Key_Format %Y-%m-%dT%H:%M:%S.%3NZ
    Include_Tag_Key On
    Tag_Key         container_tag
